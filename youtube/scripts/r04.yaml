title: "RFC 9252 in 60 Seconds: BGP Services over SRv6"
playlist: "RFCs Explained (Shorts)"
description: |
  RFC 9252 in 60 seconds: BGP overlay services over SRv6. How BGP carries the service SID for L3VPN, EVPN and Internet routes in the Prefix-SID attribute, what transposition is, and the interop pitfall it creates.

  Part of the free SRv6.md course.

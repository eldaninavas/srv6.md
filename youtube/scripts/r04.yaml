scenes:
  - type: title
    kicker: "SRv6.md · RFCs Explained"
    title: "RFC 9252"
    subtitle: "BGP services over SRv6, in 60 seconds"
    say: >
      RFC 9252, in sixty seconds. In an SRv6 VPN, a PE must learn which SID delivers each customer route.
      This RFC puts it in BGP.

  - type: bullets
    heading: "What it defines"
    bullets:
      - "**SRv6 Service TLVs** in the BGP Prefix-SID attribute"
      - "**L3** (type 5) for VPNs, **L2** (type 6) for EVPN"
      - "The SID, its **behavior** and its **structure**"
    say: >
      It adds SRv6 Service T L Vs to the BGP Prefix-SID attribute: an L3 T L V for VPN routes, and an L2 T L V for EVPN.
      Each carries the SID, its endpoint behavior, such as End D T 4, and how the SID is structured.

  - type: bullets
    heading: "Transposition"
    bullets:
      - "Function bits move **into the NLRI**"
      - "The receiver **rebuilds** the full SID"
    say: >
      To save space, the function bits can be transposed into the route itself.
      The receiving PE uses the advertised structure to rebuild the SID.

  - type: bullets
    heading: "Why you should care"
    bullets:
      - "L3VPN, EVPN and Internet, **no MPLS**"
      - "Transposition mismatch: **a top interop issue**"
    say: >
      Why care? This is how layer three VPN, EVPN and Internet routes run over SRv6 without MPLS.
      And when transposition fields don't line up between vendors, the SID is rebuilt wrong.

  - type: end
    heading: "RFC 9252, explained"
    subtitle: "TLVs, transposition and pitfalls"
    url: "srv6.md/rfcs/rfc9252"
    say: >
      The full lesson is on srv6 dot md.

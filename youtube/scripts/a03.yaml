title: "SRv6 vs ECMP, Adaptive Routing and Ultra Ethernet"
playlist: "Track 5: SRv6 for AI Networks"
description: |
  SRv6 vs Ultra Ethernet, ECMP hashing and switch adaptive routing: who picks the path for each packet in a GPU fabric, and what that changes. We compare per-flow ECMP, flowlets, adaptive routing in InfiniBand and Spectrum-X, UEC entropy spraying and SRv6 source routing, explain why SRv6 and a UEC-style transport combine rather than compete, and go through the published measurements and when each approach fits.

  This is lesson 3 of Track 5 (SRv6 for AI Networks) in the free SRv6.md course.

id: v06
lang: en
title: "SRv6 on SONiC"
playlist: "Track 6: SRv6 Configuration by Vendor"
description: |
  SONiC SRv6, explained: how the SONiC network OS forwards SRv6 in the switch ASIC through SAI and orchagent (srv6orch), why FRR supplies SIDs from BGP or static configuration rather than IS-IS, static SRv6 in CONFIG_DB for AI fabrics, the release-by-release status from 202111, and what SAI can and cannot express.

  This is lesson 6 of Track 6 (SRv6 Configuration by Vendor) in the free SRv6.md course.

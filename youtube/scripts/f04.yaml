id: f04
lang: en
title: "SRv6 Network Programming: End, End.X, End.DT4 and More"
playlist: "Track 1: SRv6 Foundations"
description: |
  SRv6 network programming explained: how a packet carries a program of SIDs, and what each instruction does. We cover the RFC 8986 endpoint behaviors (End, End.X, End.T, the DX and DT decapsulation family, Binding SIDs), the headend behaviors H.Encaps and H.Encaps.Red, the PSP, USP and USD flavors, the RFC 9800 compressed-SID flavors behind uSID, and a complete L3VPN program.

  This is lesson 4 of Track 1 (SRv6 Foundations) in the free SRv6.md course.

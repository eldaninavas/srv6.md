id: e02
lang: es
title: "Estructura del SID en SRv6: localizador, función y argumento"
playlist: "SRv6 en español"
description: |
  Cómo se compone un SID de SRv6: los 128 bits divididos en localizador (Locator), función (Function) y argumentos (Arguments), con un ejemplo, el bloque 5f00::/16 que IANA reservó para los SID SRv6 en el RFC 9602, cuándo usarlo en lugar de tu propio prefijo GUA y cómo filtrarlo en el borde del dominio en Cisco IOS XR, Juniper Junos y Linux.

  Esta es la lección 2 de la ruta SRv6 en español del curso gratuito de SRv6.md.

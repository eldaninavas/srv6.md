title: "SRv6 on Cisco IOS XR: uSID Locators and L3VPN"
playlist: "Track 6: SRv6 Configuration by Vendor"
description: |
  Cisco SRv6 configuration on IOS XR, line by line: platforms and releases, a micro-SID (uSID F3216) locator, SRv6 in IS-IS, an SRv6 L3VPN with a per-VRF SID in BGP, the documented gaps to check before a design review, and the show commands that verify each step.

  This is lesson 1 of Track 6 (SRv6 Configuration by Vendor) in the free SRv6.md course.

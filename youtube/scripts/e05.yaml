id: e05
lang: es
title: "SRv6 vs MPLS: diferencias y cuándo usar cada uno"
playlist: "SRv6 en español"
description: |
  SRv6 vs MPLS, explicado en español y con números reales. Comparamos MPLS clásico (LDP y RSVP-TE), SR-MPLS y SRv6: cómo transporta cada uno un paquete de VPN, cuánto overhead agrega, cómo cambia el plano de control, hasta dónde llega cada uno, lo que cuesta SRv6 en seguridad, operación y hardware, y cuándo conviene elegir uno u otro.

  Esta es la lección 5 de la ruta SRv6 en español del curso gratuito de SRv6.md.
links:
  "Lección escrita: SRv6 vs MPLS y SR-MPLS": https://srv6.md/es/srv6-vs-sr-mpls/
  "Curso gratuito de SRv6": https://srv6.md/learn/
  "Lección anterior, uSID": https://srv6.md/es/usid/
  "Siguiente lección, SRv6 para IA": https://srv6.md/es/ia/
hashtags: ["#SRv6", "#MPLS", "#SegmentRouting", "#Redes"]
tags: [srv6 vs mpls, srv6, mpls, sr-mpls, segment routing, ldp, rsvp-te, migración mpls srv6, srv6 en español, ingeniería de redes]

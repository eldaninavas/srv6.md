id: l05
lang: en
title: "Decode Any SRv6 SID or uSID in Your Browser"
playlist: "Track 4: Hands-on Labs"
description: |
  A free SRv6 SID decoder that runs in your browser. Paste a classic SID or a uSID container and it splits it into Locator-Block, node, function and argument bits, supports the F3216, F4816 and F1616 uSID formats, and walks the RFC 9800 shift-and-forward hop by hop. We decode a classic SID, an F3216 uSID path and a 5f00::/16 SID, and explain why you cannot read a SID's behavior from its bits.

  This is lesson 5 of Track 4 (Hands-on Labs) in the free SRv6.md course.

id: a02
lang: en
title: "Designing an AI Fabric with SRv6"
playlist: "Track 5: SRv6 for AI Networks"
description: |
  How to design an SRv6 AI fabric for a GPU backend, step by step: a multi-plane two-tier Clos, a uSID addressing plan with the plane in every uSID, static per-switch tables of 513 entries, SONiC CONFIG_DB and the FRR configuration it produces, uN versus uA, the NIC's H.Encaps.Red role, published hardware support and the security rules from the IETF AI-backend draft.

  This is lesson 2 of Track 5 (SRv6 for AI Networks) in the free SRv6.md course.

id: a01
lang: en
title: "MRC and SRv6: How OpenAI Networks 100,000 GPUs"
playlist: "Track 5: SRv6 for AI Networks"
description: |
  MRC and SRv6, explained from the published paper and the OCP specification. MRC (Multipath Reliable Connection) is an RDMA transport that sprays every connection across hundreds of paths, and in OpenAI's and Microsoft's largest GPU training clusters it rides on static SRv6 uSID source routing: the NIC writes the path into the IPv6 destination address and the switches run no BGP and no IGP. We cover the multi-plane two-tier Clos, the packet, entropy values mapped to explicit paths, how the transport handles failures, the published results and the limits the authors acknowledge.

  This is lesson 1 of Track 5 (SRv6 for AI Networks) in the free SRv6.md course.

title: "SRv6 on Juniper Junos"
playlist: "Track 6: SRv6 Configuration by Vendor"
description: |
  Juniper SRv6 on Junos and Junos Evolved, step by step: platforms and releases, a uSID block and locator, IS-IS, an SRv6 L3VPN with a uDT46 SID, Flex-Algo, TI-LFA with microloop avoidance, the verification commands and the gotchas, following the structure of Juniper's validated design for SRv6 core and edge.

  This is lesson 2 of Track 6 (SRv6 Configuration by Vendor) in the free SRv6.md course.

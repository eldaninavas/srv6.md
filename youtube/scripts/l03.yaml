id: l03
lang: en
title: "SRv6 on Linux: seg6 and iproute2 from Scratch"
playlist: "Track 4: Hands-on Labs"
description: |
  Linux SRv6 from scratch with iproute2: which seg6 and seg6local behaviors landed in which kernel, what the kernel does not implement, tested recipes for H.Encaps, H.Encaps.Red, End, End.X, End.DT4/DT6/DT46 and uSID (NEXT-C-SID), a self-contained L3VPN over SRv6 between two network namespaces, the tcpdump view with and without an SRH, and the troubleshooting table for the failures you will actually hit.

  This is lesson 3 of Track 4 (Hands-on Labs) in the free SRv6.md course.

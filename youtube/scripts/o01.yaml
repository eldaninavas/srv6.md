title: "SRv6 Troubleshooting: Ping, Traceroute and OAM"
playlist: "Track 3: Operating SRv6"
description: |
  SRv6 troubleshooting, from the first ping to the hardware FIB. How SRv6 ping and traceroute behave, what In-situ OAM (IOAM, RFC 9326) and Path Tracing add, and a step-by-step playbook for the failures you will actually meet: VPN traffic that never arrives, SRH filtering, MTU black holes and SIDs that never reach the hardware.

  This is lesson 1 of Track 3 (Operating SRv6) in the free SRv6.md course.

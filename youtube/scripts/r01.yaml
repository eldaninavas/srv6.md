id: r01
lang: en
format: short
title: "RFC 8754 in 60 Seconds: The SRv6 Header"
playlist: "RFCs Explained (Shorts)"
description: |
  RFC 8754 in 60 seconds: the IPv6 Segment Routing Header (SRH), Routing Type 4. What problem it solves, the segment list and Segments Left, why transit routers never read it, and what the HMAC TLV does and does not protect.

  Part of the free SRv6.md course.

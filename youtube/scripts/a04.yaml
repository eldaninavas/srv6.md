  "Free SRv6 course": https://srv6.md/learn/
  "Previous lesson, SRv6 vs ECMP, adaptive routing and Ultra Ethernet": https://srv6.md/ai/srv6-vs-ai-fabric-alternatives/
  "Next lesson, SRv6 for AI inference over the WAN": https://srv6.md/ai/inference-wan/
hashtags: ["#SRv6", "#AINetworking", "#DCI", "#TrafficEngineering"]

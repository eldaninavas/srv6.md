id: a04
lang: en
title: "SRv6 Between AI Data Centers (Scale-Across)"
playlist: "Track 5: SRv6 for AI Networks"
description: |
  SRv6 for scale-across AI: how SRv6 traffic engineering carries AI training traffic between data centers. We cover why scale-across needs traffic engineering, Meta's SRv6 uSID regional backbone, Alibaba Cloud's eCore for AI with per-training-job SR Policies, China Telecom's cross-cluster training architecture, other signals from China, the well-known scale-across efforts that publish no SRv6 role, and the two design patterns that emerge.

  This is lesson 4 of Track 5 (SRv6 for AI Networks) in the free SRv6.md course.

title: "SRv6 with FRRouting"
playlist: "Track 6: SRv6 Configuration by Vendor"
description: |
  FRR SRv6, from release 8.1 to 10.7: how FRRouting programs the Linux kernel's SRv6 data plane, what each release added (L3VPN, uSID, IS-IS, static SIDs, global-table services, BGP-LS), what is still missing, and an SRv6 locator, IS-IS and global IPv4/IPv6 over SRv6 configuration, line by line.

  This is lesson 5 of Track 6 (SRv6 Configuration by Vendor) in the free SRv6.md course.

title: "MPLS to SRv6 Migration: Four Real Strategies"
playlist: "Track 3: Operating SRv6"
description: |
  MPLS to SRv6 migration, planned properly. The four strategies operators use (greenfield, ship-in-the-night, SR-MPLS first, and direct MPLS to SRv6 uSID), how an SR-MPLS to SRv6 gateway translates labels and SIDs, how the Binding SID keeps the two domains apart, how IS-IS and BGP carry both data planes at once, the MTU to plan for, and a phased rollout with a rollback at every step.

  This is lesson 4 of Track 3 (Operating SRv6) in the free SRv6.md course.

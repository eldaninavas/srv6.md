title: "SRv6 vs MPLS: Differences, Overhead and When to Use Each"
playlist: "Track 1: SRv6 Foundations"
description: |
  SRv6 vs MPLS, explained with real numbers. We compare classic MPLS (LDP and RSVP-TE), SR-MPLS and SRv6: how each one carries a VPN packet, how much header overhead they add, how the control plane changes, where each one can reach, and when you should choose one or the other.

  This is lesson 6 of Track 1 (SRv6 Foundations) in the free SRv6.md course.

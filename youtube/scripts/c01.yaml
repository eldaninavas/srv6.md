id: c01
lang: en
title: "IS-IS for SRv6: Locators and SIDs in the IGP"
playlist: "Track 2: Control Plane and Services"
description: |
  IS-IS for SRv6, explained from RFC 9352. How IS-IS advertises SRv6 locators and SIDs: the SRv6 Locator TLV (type 27), End and End.X SIDs, the SID Structure that tells every router how a 128-bit SID is split, the SRv6 Capabilities sub-TLV, Flex-Algo locators, and what the configuration looks like on Cisco IOS-XR and Junos.

  This is lesson 1 of Track 2 (Control Plane and Services) in the free SRv6.md course.

id: f05
lang: en
title: "SRv6 uSID (Micro-SID) Explained: Six Hops in One Address"
playlist: "Track 1: SRv6 Foundations"
description: |
  SRv6 uSID (micro-SID) explained: why classic 128-bit SIDs cost too much on long paths, how RFC 9800 packs up to six 16-bit instructions into one IPv6 address, how each node shifts the container hop by hop, how much overhead uSID saves, and how it compares with G-SRv6.

  This is lesson 5 of Track 1 (SRv6 Foundations) in the free SRv6.md course.

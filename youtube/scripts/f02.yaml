hashtags: ["#SRv6", "#SegmentRouting", "#IPv6", "#NetworkEngineering"]
tags: [srv6 sid, srv6, srv6 sid structure, srv6 locator, 5f00::/16, rfc 9602, segment routing, segment routing over ipv6, ipv6, network engineering]
thumbnail:

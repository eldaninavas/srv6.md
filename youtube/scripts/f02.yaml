id: f02
lang: en
title: "SRv6 SID Structure: Locator, Function and Argument"
playlist: "Track 1: SRv6 Foundations"
description: |
  The SRv6 SID, taken apart. We cover the 128-bit SRv6 SID structure (locator, function and argument), why the locator is just an IPv6 route in the IGP, the 5f00::/16 block that RFC 9602 reserves for SRv6 SIDs, when to use it instead of your own global prefixes, and how to filter SIDs at the edge of your SR domain.

  This is lesson 2 of Track 1 (SRv6 Foundations) in the free SRv6.md course.
links:
  "Written lesson, SID structure": https://srv6.md/topics/sid-structure/
  "Free SRv6 course": https://srv6.md/learn/
  "Previous lesson, What is SRv6?": https://srv6.md/topics/what-is-srv6/
  "Next lesson, the SRH packet walk": https://srv6.md/topics/srh-packet-walk/

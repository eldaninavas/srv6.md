id: c06
lang: en
title: "EVPN over SRv6 and EVPN Multihoming"
playlist: "Track 2: Control Plane and Services"
description: |
  EVPN over SRv6 and EVPN multihoming, explained. How a customer device attaches to two or more PEs over one Ethernet Segment, what the ESI is, which EVPN routes multihoming uses, all-active vs single-active, DF election, aliasing, mass withdrawal, and how split-horizon works over SRv6 with the End.DT2M SID and its ESI-filtering argument (RFC 9252 and RFC 9819).

  This is lesson 6 of Track 2 (Control Plane and Services) in the free SRv6.md course.

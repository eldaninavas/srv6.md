title: "What is SRv6? Segment Routing over IPv6 Explained"
playlist: "Track 1: SRv6 Foundations"
description: |
  What is SRv6? Segment Routing over IPv6 explained from first principles: why it exists, how a SID works as an instruction, what the Segment Routing Header carries, the three roles of source, transit and endpoint, a complete L3VPN packet walk hop by hop, and the trade-offs you have to plan for.

  This is lesson 1 of Track 1 (SRv6 Foundations) in the free SRv6.md course.

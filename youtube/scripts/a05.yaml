id: a05
lang: en
title: "SRv6 for AI Inference over the WAN"
playlist: "Track 5: SRv6 for AI Networks"
description: |
  SRv6 for AI inference across a provider WAN, explained through Cisco's October 2026 AI inference WAN white paper, a high-level design for service providers and neoclouds. We cover why inference is a WAN problem, Flex-Algo SLA planes with one locator block per plane inside 5f00::/16, BGP color steering, TI-LFA inside each plane, the six connectivity models, the DCI's three jobs, and how an inference WAN differs from an MRC training fabric. Every building block maps to an open standard.

  This is lesson 5 of Track 5 (SRv6 for AI Networks) in the free SRv6.md course.
links:

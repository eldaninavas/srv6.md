scenes:
  - type: title
    kicker: "SRv6.md · RFCs Explained"
    title: "RFC 9256"
    subtitle: "SR Policy, in 60 seconds"
    say: >
      RFC 9256, in sixty seconds. How do you define a segment routing path, choose between backups,
      and send the right traffic into it? This RFC is the architecture.

  - type: bullets
    heading: "What it defines"
    bullets:
      - "Policy = **headend, color, endpoint**"
      - "**Candidate paths**, highest preference wins"
      - "Each path: one or more **segment lists**"
    say: >
      An SR Policy is identified by three things: the headend, a color and an endpoint.
      It holds candidate paths, and the valid one with the highest preference wins. Each path is one or more segment lists.

  - type: bullets
    heading: "Getting traffic in"
    bullets:
      - "**Binding SID:** one SID for the whole policy"
      - "**Color** on a BGP route steers it"
    say: >
      Two common ways to get traffic in. A Binding SID stands for the whole policy.
      Or a BGP route carries a color, and the headend steers it into the policy with that color.

  - type: bullets
    heading: "Why you should care"
    bullets:
      - "Works for **SR-MPLS and SRv6**"
      - "Color is **intent**, not priority"
    say: >
      Why care? It's the same model for SR-MPLS and SRv6. And remember: color is an intent, like low latency.
      A higher color doesn't mean a higher priority.

  - type: end
    heading: "RFC 9256, explained"
    subtitle: "Selection rules, BSID and pitfalls"
    url: "srv6.md/rfcs/rfc9256"
    say: >
      The full lesson is on srv6 dot md.

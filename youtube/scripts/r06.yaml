format: short
title: "RFC 9256 in 60 Seconds: SR Policy"
playlist: "RFCs Explained (Shorts)"
description: |
  RFC 9256 in 60 seconds: the Segment Routing Policy architecture. An SR Policy as headend, color and endpoint, candidate paths and preference, the Binding SID, and how BGP routes are steered by color, for SR-MPLS and SRv6.

  Part of the free SRv6.md course.
links:
  "Written lesson, RFC 9256 explained": https://srv6.md/rfcs/rfc9256/

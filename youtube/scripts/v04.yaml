id: v04
lang: en
title: "SRv6 on Arista EOS"
playlist: "Track 6: SRv6 Configuration by Vendor"
description: |
  Arista SRv6 on EOS: the uSID-first design (F3216), the feature timeline from uN in 4.34.2F to IS-IS, Flex-Algo and counters in 4.36, what show srv6 capabilities reports, supported platforms, the router srv6 configuration model, the OAM gotcha, and what is documented versus only interop-tested.

  This is lesson 4 of Track 6 (SRv6 Configuration by Vendor) in the free SRv6.md course.
links:
  "Written lesson (EOS SRv6)": https://srv6.md/implementations/arista-eos/

id: c03
lang: en
title: "TI-LFA Explained: Fast Reroute with Full Coverage"
playlist: "Track 2: Control Plane and Services"
description: |
  TI-LFA explained with a worked example. How Topology Independent Loop-Free Alternate (RFC 9855) pre-computes a backup path that follows the post-convergence path, how to find the P-space, the Q-space and the repair list, how the repair is encoded with SRv6 micro-SIDs, link vs node vs SRLG protection, and how to enable TI-LFA on Cisco IOS-XR.

  This is lesson 3 of Track 2 (Control Plane and Services) in the free SRv6.md course.

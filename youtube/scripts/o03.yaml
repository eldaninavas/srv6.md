  "Free SRv6 course": https://srv6.md/learn/
  "RFC 9602 and the 5f00::/16 block": https://srv6.md/rfcs/rfc9602/
  "Previous lesson, SRv6 performance measurement": https://srv6.md/topics/srpm/
  "Next lesson, MPLS to SRv6 migration": https://srv6.md/topics/interworking-migration/

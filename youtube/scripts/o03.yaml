id: o03
lang: en
title: "SRv6 Security: Filtering 5f00::/16 and the SRH"
playlist: "Track 3: Operating SRv6"
description: |
  SRv6 security for operators. Why an SRv6 network needs explicit edge filtering where MPLS was isolated by design, how to drop the SRH and the SID block at every external interface, why locators must never leak into BGP, where the 5f00::/16 block from RFC 9602 fits, what uRPF and rate limiting add, and when the SRH HMAC is worth its cost.

  This is lesson 3 of Track 3 (Operating SRv6) in the free SRv6.md course.

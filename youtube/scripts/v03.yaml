id: v03
lang: en
title: "SRv6 on Nokia SR OS"
playlist: "Track 6: SRv6 Configuration by Vendor"
description: |
  Nokia SRv6 on SR OS: classic and micro-segment (uSID) SRv6 side by side, how uSIDs are allocated, segment list depth, supported behaviors, L2 and L3 services, SR policies and Flex-Algo, multi-vendor TI-LFA, Tree-SID multicast, platforms, and how SR Linux differs.

  This is lesson 3 of Track 6 (SRv6 Configuration by Vendor) in the free SRv6.md course.
links:
  "Written lesson (SR OS SRv6)": https://srv6.md/implementations/nokia-sros/
  "Free SRv6 course": https://srv6.md/learn/
  "Previous lesson, SRv6 on Juniper Junos": https://srv6.md/implementations/juniper/
  "Next lesson, SRv6 on Arista EOS": https://srv6.md/implementations/arista-eos/
hashtags: ["#SRv6", "#Nokia", "#SROS", "#NetworkEngineering"]
tags: [nokia srv6, srv6, nokia sr os, sr os srv6, srv6 usid, micro-segment srv6, ti-lfa, flex-algo, evpn over srv6, nokia 7750, sr linux, segment routing]

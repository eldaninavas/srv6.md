scenes:
  - type: title
    kicker: "SRv6.md · RFCs Explained"
    title: "RFC 9602"
    subtitle: "The 5f00::/16 block, in 60 seconds"
    say: >
      RFC 9602, in sixty seconds. SRv6 SIDs are IPv6 addresses. So how do you tell a SID from any other address,
      and keep outsiders from sending packets to it?

  - type: title
    title: "5f00::/16"
    subtitle: "Reserved by IANA for SRv6 SIDs"
    say: >
      This RFC reserves a block of the IPv6 address space for SRv6 SIDs: five F zero zero, slash sixteen.

  - type: bullets
    heading: "What the block is"
    bullets:
      - "**Forwardable** inside your SR domain"
      - "**Not globally reachable**"
      - "Your own GUA locators **still allowed**"
    say: >
      Inside your SR domain, it's forwardable. But it's not globally reachable.
      And it's an option, not an obligation: operators may still use their own global prefixes as locators.

  - type: bullets
    heading: "Why you should care"
    bullets:
      - "SIDs are **easy to recognize**"
      - "One prefix to **filter at every edge**"
    say: >
      Why care? With SIDs in one well-known block, they're easy to recognize,
      and you have one prefix to filter at the edge of your domain.

  - type: end
    heading: "RFC 9602, explained"
    subtitle: "The block, and how to filter it"
    url: "srv6.md/rfcs/rfc9602"
    say: >
      The full lesson is on srv6 dot md.

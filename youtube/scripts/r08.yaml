hashtags: ["#SRv6", "#RFC9602", "#IPv6", "#Shorts"]
tags: [rfc 9602, 5f00::/16, srv6 sid block, srv6 security, srv6 filtering, iana srv6, ipv6 addressing, srv6 rfc, segment routing, network engineering]
thumbnail:
  kicker: "RFC 9602"

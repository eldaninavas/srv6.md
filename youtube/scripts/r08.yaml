id: r08
lang: en
format: short
title: "RFC 9602 in 60 Seconds: The 5f00::/16 Block"
playlist: "RFCs Explained (Shorts)"
description: |
  RFC 9602 in 60 seconds: where SRv6 SIDs fit in the IPv6 addressing architecture, and the 5f00::/16 block IANA reserved for SRv6 SIDs. Why a dedicated block makes SIDs easy to recognize and filter at the edge of an SR domain.

  Part of the free SRv6.md course.
links:
  "Written lesson, RFC 9602 explained": https://srv6.md/rfcs/rfc9602/

id: l04
lang: en
title: "Reading SRv6 in Wireshark: SRH Filters and Captures"
playlist: "Track 4: Hands-on Labs"
description: |
  How to read SRv6 in Wireshark with a free library of annotated pcapng captures from a real Linux lab. We cover the SRH display filters that matter, how to catch SRv6 packets that have no SRH at all, what Wireshark 4.4 does not decode, and three captures frame by frame: H.Encaps with Segments Left counting down, the reduced SRH of H.Encaps.Red, and the uSID container shift.

  This is lesson 4 of Track 4 (Hands-on Labs) in the free SRv6.md course.

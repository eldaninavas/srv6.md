# Long story (~1:30): you build the internet, starting from two cans and a
# string. One diorama that grows: each "but..." adds a piece, like
# loconstruiste. No technical words until the reveal at the end.
#
# Map: your block in front (z 1..6) around a box at [0, 3.8]; your cousin's
# block at the back around a box at [0, -4.4]; the main cable runs straight
# between them, the backup runs the long way around on the west side.
id: l01
engine: chatterbox
exaggeration: 0.75
tempo: 0.85            # Chatterbox rushes; slow it a little, same pitch
gap: 0.6
end_card: {url: srv6.md, sub: "How the internet really works"}
caption: |
  You've been building the internet since you were a kid. You just didn't know it. 🥫🧵

  Learn how networks really work → link in bio (srv6.md)

  #Internet #Networking #Telecom #HowItWorks #NetworkEngineering #Routers
beats:
  - say: "When you were a kid, your best friend's house was right across the street."
    do:
      - {at: 0, link: [[0, 7.6], [0, 4.6]], style: road, width: 1}
      - {at: 0, add: house, id: you, pos: [-2.2, 6], color: purple}
      - {at: 0, tag: {on: you, text: "You", color: purple}}
      - {at: "friend's", add: house, id: friend, pos: [2.2, 6], color: green}
      - {at: "friend's", tag: {on: friend, text: "Best friend", color: green}}

  - say: "Every night you wanted to talk. But shouting across the street? Mom said no!"
    do:
      - {at: "shouting", tag: {on: you, text: "HEEEY!", color: orange}}
      - {at: "Mom", tag: {on: you, text: "Shhh!", color: red}}

  - say: "So you grab two tin cans and a long string. And it works!"
    do:
      - {at: "string", untag: you}
      - {at: "string", link: [you, friend]}
      - {at: "works", tag: {on: you, text: "Hello?", color: purple}}
      - {at: "works", tag: {on: friend, text: "Hi!", color: green}}
      - {at: "works", pulse: friend, color: green}

  - say: "Then a new kid moves in down the block. She wants in too!"
    do:
      - {at: 0, untag: you}
      - {at: 0, untag: friend}
      - {at: "kid", add: house, id: k3, pos: [-2.8, 3.1], color: orange}
      - {at: "wants", tag: {on: k3, text: "Me too!", color: orange}}

  - say: "Easy. One string to you, and one to your friend."
    do:
      - {at: "you", link: [k3, you]}
      - {at: "friend", link: [k3, friend]}

  - say: "Then a fourth kid. And a fifth! Now there are strings everywhere. What a mess!"
    do:
      - {at: 0, untag: k3}
      - {at: "fourth", add: house, id: k4, pos: [2.8, 3.1], color: teal}
      - {at: "fourth", link: [k4, you]}
      - {at: "fourth", link: [k4, friend]}
      - {at: "fourth", link: [k4, k3]}
      - {at: "fifth", add: house, id: k5, pos: [1.3, 1.1], color: yellow}
      - {at: "fifth", link: [k5, you]}
      - {at: "fifth", link: [k5, friend]}
      - {at: "fifth", link: [k5, k3]}
      - {at: "fifth", link: [k5, k4]}
      - {at: "everywhere", big: "10 strings", sub: "for just 5 friends", dur: 2.2}
      - {at: "mess", pulse: [you, friend, k3, k4, k5], color: red}

  - say: "So you get a better idea. One box, right in the middle of the block."
    do:
      - {at: "box", add: router, id: hub, pos: [0, 3.8]}
      - {at: "middle", pulse: hub}

  - say: "Everyone runs just one string to the box. Five strings, instead of ten!"
    do:
      - {at: "Everyone", unlink: [you, friend]}
      - {at: "Everyone", unlink: [k3, you]}
      - {at: "Everyone", unlink: [k3, friend]}
      - {at: "Everyone", unlink: [k4, you]}
      - {at: "Everyone", unlink: [k4, friend]}
      - {at: "Everyone", unlink: [k4, k3]}
      - {at: "Everyone", unlink: [k5, you]}
      - {at: "Everyone", unlink: [k5, friend]}
      - {at: "Everyone", unlink: [k5, k3]}
      - {at: "Everyone", unlink: [k5, k4]}
      - {at: "string", link: [you, hub]}
      - {at: "string", link: [friend, hub]}
      - {at: "string", link: [k3, hub]}
      - {at: "string", link: [k4, hub]}
      - {at: "string", link: [k5, hub]}
      - {at: "Five", tag: {on: hub, text: "5 instead of 10!", color: green}}

  - say: "Want to talk to someone? The box connects you."
    do:
      - {at: 0, untag: hub}
      - {at: "talk", route: [you, hub, k5], color: purple}
      - {at: "connects", pulse: hub}
      - {at: "connects", tag: {on: k5, text: "Hi!", color: yellow}}

  - say: "Then your cousin, across town, wants to join. Her block has a box too."
    do:
      - {at: 0, unroute: true}
      - {at: 0, untag: k5}
      - {at: "cousin", add: house, id: cousin, pos: [-2, -6.2], color: pink}
      - {at: "cousin", tag: {on: cousin, text: "Your cousin", color: pink}}
      - {at: "block", add: house, id: c2, pos: [2, -6.2], color: blue}
      - {at: "box", add: router, id: hub2, pos: [0, -4.4]}
      - {at: "box", link: [cousin, hub2]}
      - {at: "box", link: [c2, hub2]}

  - say: "So you run one long cable, box to box. Now both blocks can talk!"
    do:
      - {at: "cable", link: [hub, hub2]}
      - {at: "talk", route: [you, hub, hub2, cousin], color: purple}
      - {at: "talk", tag: {on: cousin, text: "Hi, cousin!", color: pink}}

  - say: "But one night, a truck snaps the cable. Both blocks go silent."
    do:
      - {at: 0, unroute: true}
      - {at: 0, untag: cousin}
      - {at: "truck", link: [[3.9, -1.1], [-1, -1.1]], style: road, width: 1}
      - {at: "truck", add: truck, id: truck, pos: [3.6, -1.1], color: orange}
      - {at: "truck", move: truck, path: [[3.6, -1.1], [0.4, -1.1]], dur: 1.2}
      - {at: "snaps", fail: [hub, hub2]}

  - say: "You run outside in your pajamas. Your cousin can't hear a thing!"
    do:
      - {at: "pajamas", pulse: hub, color: red}
      - {at: "cousin", tag: {on: cousin, text: "Hello...?", color: grey}}

  - say: "So you add a second cable, the long way around."
    do:
      - {at: 0, untag: cousin}
      - {at: "second", add: router, id: west, pos: [-2.9, -1.8]}
      - {at: "cable", link: [hub, west]}
      - {at: "long", link: [west, hub2]}

  - say: "Now if one breaks, the other takes over. Nobody even notices!"
    do:
      - {at: "breaks", route: [you, hub, west, hub2, cousin], color: green}
      - {at: "notices", tag: {on: cousin, text: "Still here!", color: green}}
      - {at: "notices", pulse: cousin, color: green}

  - say: "Soon, every town wants in. Millions of boxes, all over the world."
    do:
      - {at: 0, unroute: true}
      - {at: 0, untag: cousin}
      - {at: "town", fix: [hub, hub2]}
      - {at: "town", remove: truck}
      - {at: "Millions", big: "Millions of boxes", sub: "all over the world", dur: 2.6}

  - say: "So how does your message find its way? Like a letter, it carries an address."
    do:
      - {at: "message", add: packet, id: msg, pos: [-2.2, 6]}
      - {at: "address", tag: {on: msg, text: "To: your cousin", color: purple}}

  - say: "Every box looks at it, and passes it one step closer."
    do:
      - {at: "Every", move: msg, path: [you, hub, hub2, cousin], dur: 3.4}
      - {at: "looks", pulse: hub}
      - {at: "closer", pulse: hub2}

  - say: "Delivered! Faster than the blink of an eye."
    do:
      - {at: "Delivered", untag: msg}
      - {at: "Delivered", tag: {on: cousin, text: "Got it!", color: green}}
      - {at: "Delivered", pulse: cousin, color: green}

  - say: "Every photo you send, every video call with your cousin, does exactly this."
    do:
      - {at: "photo", untag: cousin}
      - {at: "photo", add: packet, id: msg2, pos: [-2.2, 6], color: orange}
      - {at: "photo", move: msg2, path: [you, hub, hub2, cousin], dur: 2.4}
      - {at: "call", add: packet, id: msg3, pos: [-2, -6.2], color: green}
      - {at: "call", move: msg3, path: [cousin, hub2, hub, you], dur: 2.4}
      - {at: "exactly", remove: [msg, msg2, msg3]}

  - say: "Those boxes? Routers. The strings? Fiber. And all of it together? The internet."
    do:
      - {at: 0, untag: cousin}
      - {at: "Routers", tag: {on: hub, text: "Router", color: dark}}
      - {at: "Routers", tag: {on: hub2, text: "Router", color: dark}}
      - {at: "Fiber", route: [you, hub, hub2, cousin], color: yellow}
      - {at: "internet", big: "The internet", sub: "you built it!", dur: 2.6}

  - say: "Want to know how it really works? Start for free at srv6 dot md."
    text: "Want to know how it really works? Start for free at srv6.md"
    do:
      - {at: "Start", end: true}

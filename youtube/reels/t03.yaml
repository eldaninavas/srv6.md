# Telecom story: where your internet really comes from (fiber to the home).
id: t03
engine: chatterbox
exaggeration: 0.75
speed: 1.1
caption: |
  Your Wi-Fi only covers the last few meters. The rest is a thread of glass. ✨

  Learn how networks really work → link in bio (srv6.md)

  #Fiber #Telecom #Internet #WiFi #Networking #NetworkEngineering
beats:
  - say: "Where does your internet actually come from?"
    do:
      - {at: 0, add: house, id: you, pos: [0, 6.4], color: purple}
      - {at: 0, tag: {on: you, text: "You", color: purple}}

  - say: "Your Wi-Fi only covers the last few meters. The rest? A glass thread, thinner than a hair."
    do:
      - {at: "Wi-Fi", tag: {on: you, text: "Wi-Fi", color: blue}}
      - {at: "glass", add: box, id: cab, pos: [0, 2.8], size: [0.9, 1.1, 0.6], color: 0x64748b}
      - {at: "thread", link: [you, cab]}
      - {at: "thread", route: [you, cab], color: yellow}

  - say: "It runs to a little box down the street, where your neighbors' fibers join yours."
    do:
      - {at: "box", tag: {on: cab, text: "Street box", color: dark}}
      - {at: "neighbors", add: house, id: n1, pos: [-2.8, 5.4], color: orange}
      - {at: "neighbors", add: house, id: n2, pos: [2.8, 5.4], color: teal}
      - {at: "join", link: [n1, cab]}
      - {at: "join", link: [n2, cab]}

  - say: "Then on to your operator's building, and from there, out to the rest of the internet."
    do:
      - {at: "operator's", add: building, id: op, pos: [0, -1.4], height: 2}
      - {at: "operator's", link: [cab, op]}
      - {at: "building", tag: {on: op, text: "Your operator", color: purple}}
      - {at: "internet", add: datacenter, id: dc, pos: [-1.9, -5.4]}
      - {at: "internet", add: cloud, id: cl, pos: [2, -5.2]}
      - {at: "internet", link: [op, dc]}
      - {at: "internet", link: [op, cl]}

  - say: "And the whole way, your data travels as light. That's why fiber is so fast!"
    do:
      - {at: "whole", add: packet, id: l1, pos: [0, 6.4], color: yellow}
      - {at: "travels", move: l1, path: [you, cab, op, dc], dur: 2}
      - {at: "light", route: [you, cab, op, dc], color: yellow}
      - {at: "fast", untag: op}
      - {at: "fast", tag: {on: you, text: "Fast!", color: green}}

  - say: "Next time your internet flies, thank a thread of glass. Learn how networks work at srv6 dot md."
    text: "Next time your internet flies, thank a thread of glass. Learn how networks work at srv6.md"
    do:
      - {at: "Learn", end: true}

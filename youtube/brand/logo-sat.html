</head><body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const S = 1080, r = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
r.setSize(S, S); r.setPixelRatio(1); r.toneMapping = THREE.NeutralToneMapping; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), .04).texture;
const cam = new THREE.PerspectiveCamera(32, 1, .1, 200); cam.position.set(0, .6, 15); cam.lookAt(0, .2, 0);
const sun = new THREE.DirectionalLight(0xfff4e0, 2.6); sun.position.set(5, 6, 7); scene.add(sun);
const rim = new THREE.DirectionalLight(0x8fd3ff, 2.2); rim.position.set(-6, 2, -4); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xcfe6ff, 0x2b1a6b, .7));
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .45, ...o });
const add = (p, geo, m, x = 0, y = 0, z = 0) => { const k = new THREE.Mesh(geo, m); k.position.set(x, y, z); p.add(k); return k; };

// Earth: a big planet curving across the bottom
const earth = new THREE.Group(); earth.position.set(0, -15.2, -4); scene.add(earth);
add(earth, new THREE.SphereGeometry(11, 96, 64), M(0x2f7bf5, { roughness: .6 }));
const land = M(0x3fbf6a, { roughness: .8, flatShading: true });
for (const [lat, lon, s] of [[.55, -.5, 2.6], [.75, .45, 2.0], [.35, .9, 1.5], [.9, -.05, 1.3], [.45, -1.2, 1.7]]) {
  const b = add(earth, new THREE.IcosahedronGeometry(s, 1), land); b.scale.set(1, .35, 1);
  b.position.setFromSphericalCoords(10.75, lat, lon); b.lookAt(0, 0, 0); b.rotateX(Math.PI / 2);
}
const atmo = add(earth, new THREE.SphereGeometry(11.45, 96, 64), new THREE.MeshBasicMaterial({ color: 0x8fd3ff, transparent: true, opacity: .35, side: THREE.BackSide, blending: THREE.AdditiveBlending, toneMapped: false }));

// satellite: gold body, two solar wings, a dish
const sat = new THREE.Group(); sat.position.set(2.0, 1.45, -.5); sat.rotation.set(.3, -.75, -.22); sat.scale.setScalar(.82); scene.add(sat);
const gold = M(0xf2b632, { metalness: .9, roughness: .3 });
add(sat, new THREE.BoxGeometry(1.15, 1.15, 1.15), gold);
add(sat, new THREE.BoxGeometry(1.2, .14, 1.2), M(0x8b5cf6), 0, .45, 0);
const panel = M(0x2a4bd6, { metalness: .6, roughness: .25 }), frame = M(0xe5e7eb, { metalness: .8, roughness: .3 });
for (const sx of [-1, 1]) {
  add(sat, new THREE.CylinderGeometry(.05, .05, .7, 10), frame, sx * .9, 0, 0).rotation.z = Math.PI / 2;
  const w = new THREE.Group(); w.position.x = sx * 2.05; sat.add(w);
  add(w, new THREE.BoxGeometry(1.7, .06, .95), panel);
  for (let i = -2; i <= 2; i++) add(w, new THREE.BoxGeometry(.03, .075, .97), frame, i * .34, 0, 0);
  add(w, new THREE.BoxGeometry(1.72, .075, .03), frame, 0, 0, 0);
}
const dish = add(sat, new THREE.SphereGeometry(.6, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2.6), M(0xf8fafc, { side: THREE.DoubleSide, metalness: .3 }), 0, -.95, 0);
dish.rotation.x = Math.PI;
add(sat, new THREE.CylinderGeometry(.04, .04, .55, 8), frame, 0, -.85, 0);
add(sat, new THREE.SphereGeometry(.07, 16, 12), M(0xff4d4d, { emissive: 0xff2d2d, emissiveIntensity: 1 }), 0, -1.15, 0);

// astronaut: chibi proportions, big helmet, glossy visor
const astro = new THREE.Group(); astro.position.set(-1.9, -.2, .6); astro.rotation.set(.12, .12, .22); scene.add(astro);
const suit = M(0xf8fafc, { roughness: .55 }), accent = M(0x8b5cf6), grey = M(0xc7ccd6);
add(astro, new THREE.CapsuleGeometry(.62, .55, 8, 24), suit, 0, -.35, 0);
add(astro, new THREE.BoxGeometry(.95, .95, .45), grey, 0, -.2, -.55);
add(astro, new THREE.BoxGeometry(.48, .32, .1), accent, 0, -.2, .6);
add(astro, new THREE.SphereGeometry(.06, 12, 8), M(0xffd23f, { emissive: 0xffc400, emissiveIntensity: .8 }), .12, -.2, .66);
add(astro, new THREE.SphereGeometry(.06, 12, 8), M(0x22c55e, { emissive: 0x22c55e, emissiveIntensity: .8 }), -.12, -.2, .66);
add(astro, new THREE.SphereGeometry(.95, 48, 32), suit, 0, .95, 0);
add(astro, new THREE.TorusGeometry(.72, .1, 12, 40), accent, 0, .3, 0).rotation.x = Math.PI / 2;
const visor = add(astro, new THREE.SphereGeometry(.78, 48, 32, Math.PI * .08, Math.PI * .84, Math.PI * .26, Math.PI * .42),
  M(0x1a2a6c, { metalness: .9, roughness: .08 }), 0, .93, .25);
add(astro, new THREE.SphereGeometry(.12, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffffff }), -.3, 1.2, .98).scale.set(1.2, .7, .4);
// arms: right waves, left holds the line
const arm = (x, rz, rx) => { const g = new THREE.Group(); g.position.set(x, .05, 0); g.rotation.set(rx, 0, rz); astro.add(g);
  add(g, new THREE.CapsuleGeometry(.2, .55, 6, 16), suit, 0, -.42, 0); add(g, new THREE.SphereGeometry(.24, 20, 14), grey, 0, -.82, 0); return g; };
arm(-.68, -2.4, 0);                      // waving hand up
const hold = arm(.68, 1.15, -.35);       // reaching toward the satellite
for (const sx of [-1, 1]) {
  const l = new THREE.Group(); l.position.set(sx * .3, -.95, 0); l.rotation.set(.35 + sx * .15, 0, sx * .18); astro.add(l);
  add(l, new THREE.CapsuleGeometry(.23, .45, 6, 16), suit, 0, -.35, 0); add(l, new THREE.BoxGeometry(.38, .26, .5), grey, 0, -.72, .08);
}
scene.updateMatrixWorld(true);

// the tether: a glowing line from the astronaut's hand to the satellite, a packet of light on it
const hand = new THREE.Vector3(0, -.82, 0).applyMatrix4(hold.matrixWorld), port = new THREE.Vector3(-.6, -.2, .2).applyMatrix4(sat.matrixWorld);
const curve = new THREE.CatmullRomCurve3([hand, new THREE.Vector3((hand.x + port.x) / 2 - .2, Math.min(hand.y, port.y) - .55, .9), port]);
add(scene, new THREE.TubeGeometry(curve, 80, .045, 10), new THREE.MeshBasicMaterial({ color: 0xc4b5fd, toneMapped: false }));
const glowTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d');
  const gr = g.createRadialGradient(128, 128, 0, 128, 128, 128); gr.addColorStop(0, 'rgba(255,240,170,1)'); gr.addColorStop(.35, 'rgba(255,200,40,.6)'); gr.addColorStop(1, 'rgba(255,200,40,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 256); return new THREE.CanvasTexture(c); })();
const P = curve.getPointAt(.55);
add(scene, new THREE.SphereGeometry(.19, 32, 24), M(0xffd23f, { emissive: 0xffb800, emissiveIntensity: .7 }), P.x, P.y, P.z);
const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, transparent: true, opacity: .8, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false }));
halo.scale.setScalar(1.2); halo.position.copy(P); scene.add(halo);
for (const [u, s] of [[.47, .1], [.41, .07], [.36, .045]]) { const q = curve.getPointAt(u);
  add(scene, new THREE.SphereGeometry(s, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd23f, toneMapped: false }), q.x, q.y, q.z); }

      - {id: replace_csid, name: REPLACE-C-SID (G-SID), ref: RFC 9800, link: ../rfcs/rfc9800.md}
  - id: cat-control
    name: Control plane
    rows:
      - {id: isis, name: IS-IS SRv6, ref: RFC 9352, link: ../rfcs/rfc9352.md}
      - {id: ospfv3, name: OSPFv3 SRv6, ref: RFC 9513, link: ../rfcs/rfc9513.md}
      - {id: bgp_l3vpn, name: BGP L3VPN over SRv6, ref: RFC 9252, link: ../rfcs/rfc9252.md}

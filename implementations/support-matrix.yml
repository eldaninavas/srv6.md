# SRv6 support matrix data, rendered into support-matrix.md by hooks/support_matrix.py.
#
# Cell format:  <row id>: {s: yes|partial|no|unknown, r: "<first release>", note: "<short note>", src: <key or [keys]>}
# - A missing cell renders as "unknown".
# - Every yes / partial / no needs a source that states it. Unknown is better than a guess.
# - r is the first release a source documents. Leave it out when no source states one.
# - Sources are listed per platform under `sources:` and become footnotes on the page.
#
# Corrections: https://github.com/eldaninavas/srv6.md/issues (or edit this file in a pull request)

verified: 2026-10-20

platforms:
  - {id: iosxr, name: IOS-XR, full: Cisco IOS-XR, page: cisco-ios-xr.md}
  - {id: iosxe, name: IOS-XE, full: Cisco IOS-XE, page: cisco-ios-xe.md}
  - {id: junos, name: Junos, full: Juniper Junos / Junos Evolved, page: juniper.md}
  - {id: eos, name: EOS, full: Arista EOS, page: arista-eos.md}
  - {id: sros, name: SR OS, full: Nokia SR OS, page: nokia-sros.md}
  - {id: vrp, name: VRP, full: Huawei VRP}
  - {id: frr, name: FRR, full: FRRouting, page: frrouting.md}
  - {id: linux, name: Linux, full: Linux kernel, page: linux-kernel.md}
  - {id: sonic, name: SONiC, full: SONiC, page: sonic.md}
  - {id: vpp, name: VPP, full: FD.io VPP}
  - {id: cilium, name: Cilium, full: Cilium (open source), page: cilium.md}


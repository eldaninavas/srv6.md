      - {id: pcep, name: PCEP SRv6, ref: RFC 9603, link: ../rfcs/rfc9603.md}
      - {id: sr_policy, name: SRv6 SR Policy, ref: RFC 9256 / RFC 9830, link: ../topics/sr-policy.md}
  - id: cat-protection
    name: Protection and traffic engineering
    rows:
      - {id: ti_lfa, name: TI-LFA, ref: RFC 9855, link: ../topics/ti-lfa.md}
      - {id: microloop, name: Microloop avoidance, link: ../topics/micro-loop-avoidance.md}
      - {id: flex_algo, name: Flex-Algo, ref: RFC 9350, link: ../topics/flex-algorithm.md}
  - id: cat-multicast
    name: Multicast
    rows:
      - {id: multicast, name: SRv6 multicast, ref: RFC 9524 / MVPN, link: ../topics/multicast.md}
  - id: cat-oam
    name: OAM
    rows:
      - {id: ping_trace, name: Ping / traceroute to SIDs, ref: RFC 9259, link: ../rfcs/rfc9259.md}
      - {id: pm, name: Performance measurement, ref: RFC 9503, link: ../topics/srpm.md}
  - id: cat-mobile
    name: Mobile user plane
    rows:
      - {id: mup, name: Mobile user plane, ref: RFC 9433, link: ../rfcs/rfc9433.md}


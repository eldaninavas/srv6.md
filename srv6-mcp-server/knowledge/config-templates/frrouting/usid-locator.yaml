description: uSID locator on FRRouting (zebra).
parameters:
  source_address: "2001:db8:0:1::1"
  locator_name: MAIN
  locator_prefix: "fcbb:bb00:1::/48"
  func_bits: 16
notes:
  - "On FRR 10.x the uSID behavior is set with 'behavior usid'; newer releases also offer 'format usid-f3216'. Check 'show running-config' syntax for your version."
  - Block /32 plus 16-bit node ID gives the common F3216 layout.
template: |
  segment-routing
   srv6
    encapsulation
     source-address {{source_address}}
    exit
    locators
     locator {{locator_name}}
      prefix {{locator_prefix}} func-bits {{func_bits}}
      behavior usid
     exit
    exit
   exit
  exit
